rule-providers:
  private: {type: http, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt, path: ./ruleset/private.yaml, interval: 86400, proxy: DIRECT}
  cn-domains: {type: http, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt, path: ./ruleset/cn-domains.yaml, interval: 86400, proxy: DIRECT}
  cn-ip: {type: http, behavior: ipcidr, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt, path: ./ruleset/cn-ip.yaml, interval: 86400, proxy: DIRECT}
  gfw: {type: http, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt, path: ./ruleset/gfw.yaml, interval: 86400, proxy: DIRECT}
  proxy: {type: http, behavior: domain, url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt, path: ./ruleset/proxy.yaml, interval: 86400, proxy: DIRECT}

rules:
  - RULE-SET,private,DIRECT
  - RULE-SET,cn-domains,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - RULE-SET,gfw,PROXY
  - RULE-SET,proxy,PROXY
  - MATCH,PROXY
