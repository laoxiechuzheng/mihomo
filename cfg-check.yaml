mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter: ['*.lan','*.local','localhost.ptlogin2.qq.com','+.msftconnecttest.com','+.msftncsi.com','time.*.com','time.*.gov','time.*.edu.cn','*.ntp.org.cn','*.pool.ntp.org']
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver:
    - 'https://dns.alidns.com/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'
  proxy-server-nameserver:
    - 'https://dns.alidns.com/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'
  nameserver-policy:
    'geosite:cn': ['https://dns.alidns.com/dns-query#DIRECT','https://doh.pub/dns-query#DIRECT']
    'rule-set:private': ['https://dns.alidns.com/dns-query#DIRECT','https://doh.pub/dns-query#DIRECT']
    'geosite:geolocation-!cn': ['https://dns.alidns.com/dns-query#PROXY','https://doh.pub/dns-query#PROXY']

