mixed-port: 7890
mode: rule
log-level: silent

proxies:
  - name: chimera-v06-test
    type: chimera
    server: 192.0.2.1
    port: 9443
    sni: proxy.example
    public-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    short-id: "0102030405060708"
    client-fingerprint: chrome
    mode: auto
    udp: true
    quic-psk: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    quic-fp: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    auto-quic-timeout: 1200

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - chimera-v06-test

rules:
  - MATCH,PROXY
